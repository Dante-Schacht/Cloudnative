spring:
  application:
    name: order-service
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      accept-float-as-int: false

  rabbitmq:
    # Lista de nodos del clúster; el cliente prueba cada dirección. Credenciales solo por entorno.
    addresses: ${RABBITMQ_ADDRESSES:localhost:5672,localhost:5673}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    connection-timeout: 3s
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  datasource:
    # Local: PostgreSQL de docker-compose. Cloud SQL: ver application-cloud.yml y docs/ARQUITECTURA_CLOUD.md.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cloudorders}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # el esquema lo gestiona solo Flyway (db/migration)
  flyway:
    enabled: true

server:
  port: 8080

cloudorders:
  rabbitmq:
    # Nombres centralizados de la topología (order-service la declara al iniciar).
    exchange: orders.exchange              # topic
    dead-letter-exchange: orders.dlx       # direct
    order-created-routing-key: orders.created
    publish-timeout: 5s
    queues:
      created:
        name: orders.created.queue
        binding-key: orders.created
        dead-letter-routing-key: orders.created.dead
        dead-letter-queue: orders.created.dlq
      audit:
        name: orders.audit.queue
        binding-key: "orders.#"
        dead-letter-routing-key: orders.audit.dead
        dead-letter-queue: orders.audit.dlq
      inventory:
        name: orders.inventory.queue
        binding-key: orders.created
        dead-letter-routing-key: orders.inventory.dead
        dead-letter-queue: orders.inventory.dlq
  cors:
    # Orígenes permitidos separados por coma; no usar "*".
    allowed-origins: http://localhost:5173
  security:
    jwt:
      # Microsoft Entra ID (tokens v2). Sin tenant/audience configurados toda petición protegida responde 401.
      tenant-id: ${ENTRA_TENANT_ID:}
      audience: ${ENTRA_API_AUDIENCE:}
      issuer: ${ENTRA_ISSUER:}          # opcional; por defecto https://login.microsoftonline.com/{tenant}/v2.0
      jwk-set-uri: ${ENTRA_JWKS_URI:}   # opcional; por defecto .../{tenant}/discovery/v2.0/keys
      read-scope: orders.read
      write-scope: orders.write
